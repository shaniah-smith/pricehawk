[project]
name = "pricehawk"
version = "0.1.0"
description = "An AI shopping scout over MCP: compare prices, spot new releases, track deals and buy with confirmation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pricehawk = "pricehawk.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricehawk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
